# Issues tomorrow's ISO-NE demand forecast every morning and commits it, so the
# Streamlit app (which redeploys on push) always shows the latest forecast.
name: Daily day-ahead forecast

on:
  # GitHub starts scheduled jobs hours late or drops them altogether (Nov 3 and
  # Nov 4 never started). So there is a slot every hour from late morning to
  # evening ET: the first one GitHub actually runs issues the forecast, and the
  # rest see it is already published and stop within seconds.
  schedule:
    - cron: "41 15-23 * * *"   # 10:41 AM - 6:41 PM EST / 11:41 AM - 7:41 PM EDT
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

# The daily forecast and the monthly retrain both push to this repo; run them one
# at a time so neither push is rejected.
concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Already issued today?
        id: check
        run: |
          tomorrow=$(TZ=America/New_York date -d tomorrow +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q ",$tomorrow," data/dayahead/latest_forecast.csv; then
            echo "Forecast for $tomorrow is already published; nothing to do."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.done != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - if: steps.check.outputs.done != 'true'
        run: pip install -r requirements.txt
      - if: steps.check.outputs.done != 'true'
        name: Issue forecast
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python forecast_tomorrow.py
      - if: steps.check.outputs.done != 'true'
        name: Update supply mix
        continue-on-error: true      # never block the forecast commit
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python update_supply.py
      - if: steps.check.outputs.done != 'true'
        name: Commit forecast
        run: |
          git config user.name "forecast-bot"
          git config user.email "actions@github.com"
          git add data/dayahead/latest_forecast.csv data/dayahead/forecast_log.csv
          git add data/dayahead/supply.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Day-ahead forecast $(date -u +%F)"
          git pull --rebase --autostash || true
          git push || (sleep 15 && git pull --rebase --autostash && git push)
