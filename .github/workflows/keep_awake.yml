name: Keep app awake

on:
  # The app sleeps after ~12 hours without visits. GitHub often starts scheduled
  # jobs hours late, so visit every 2 hours to leave plenty of margin.
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - uses: actions/checkout@v5
      - run: python scripts/keep_awake.py
