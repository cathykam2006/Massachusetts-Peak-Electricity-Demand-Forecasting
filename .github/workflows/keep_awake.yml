name: Keep app awake

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours; the app sleeps after ~12 hours without visits
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/keep_awake.py
